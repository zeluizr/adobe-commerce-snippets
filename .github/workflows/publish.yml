name: Release

# Empacota o .vsix ao enviar uma tag de versão (ex.: v0.1.0) e o anexa à Release
# do GitHub. NÃO publica no Marketplace: a publicação é manual, com
# `vsce login commenteme` seguido de `vsce publish`, como no vtex-io-snippets e no shopify-snippets.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Empacotar o .vsix
        run: npx --yes @vscode/vsce@3 package
      - name: Anexar o .vsix à Release do GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
